name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate configuration
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }

      - name: Clone GitHub repository as mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Push branches and tags to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          set -euo pipefail
          cd repository.git

          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/data-platform.git"

          # Mirror normal branches and tags only. GitHub-specific refs/pull/* are excluded.
          git push --force --prune gitverse \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

      - name: Verify exact mirrored state
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          set -euo pipefail
          cd repository.git

          ref_to_verify="$GITHUB_REF"
          if ! git show-ref --verify --quiet "$ref_to_verify"; then
            # Branch-deletion pushes no longer have the deleted ref locally.
            ref_to_verify="refs/heads/main"
          fi

          expected_sha="$(git rev-parse "$ref_to_verify")"
          actual_sha="$(git ls-remote \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/data-platform.git" \
            "$ref_to_verify" | awk '{print $1}')"

          test -n "$actual_sha" || { echo "::error::Mirrored ref $ref_to_verify is missing on GitVerse"; exit 1; }
          test "$actual_sha" = "$expected_sha" || {
            echo "::error::GitVerse ref mismatch for $ref_to_verify: expected $expected_sha, got $actual_sha"
            exit 1
          }

          echo "Verified $ref_to_verify at $expected_sha"

      - name: Summary
        if: success()
        run: |
          echo "### GitVerse mirror updated and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`arvectum/data-platform\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
